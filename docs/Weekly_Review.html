<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Averroes — Weekly Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Ishu's PRIVATE Wednesday meeting pack. Deliberately NOT a page in the tool:
  the team never sees it. Open this file in a browser any time - it pulls the
  numbers live from the backend, through the same code paths as the Analytics
  and Responded pages, so it can never disagree with them.

  Auth: the backend endpoint (/weekly-review) is token-gated. The token is
  NEVER stored in this file (it lives in the git repo - doctrine 8: no tokens
  in git). On first open the page asks for it once and keeps it in this
  browser's localStorage.

  Print / save PDF: each slide prints as one page - the 3-page deck.
-->
<style>
  :root { --ink:#0f172a; --grey:#64748b; --faint:#94a3b8; --line:#e2e8f0;
          --plum:#4a2a6b; --teal:#0f5132; --amber:#8a4b0f; --red:#8c1d2a; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         background: #eef1f5; color: var(--ink); margin: 0; padding: 24px; }
  .top { max-width: 900px; margin: 0 auto 14px; display: flex; align-items: baseline; gap: 12px; }
  .top h1 { font-size: 20px; margin: 0; }
  .top .sub { color: var(--grey); font-size: 12px; }
  .top button { margin-left: auto; border: 1px solid #cbd5e1; background: #fff; border-radius: 7px;
                padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; color: #334155; }
  .top button:hover { background: #f8fafc; }
  .slide { max-width: 900px; margin: 0 auto 16px; background: #fff; border: 1px solid var(--line);
           border-radius: 12px; padding: 20px 24px; }
  .shead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .shead .n { width: 24px; height: 24px; border-radius: 999px; background: var(--ink); color: #fff;
              font-size: 12px; font-weight: 800; display: inline-flex; align-items: center;
              justify-content: center; align-self: center; flex: none; }
  .shead h2 { font-size: 16px; margin: 0; }
  .shead .d { margin-left: auto; font-size: 11px; color: var(--faint); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .kpi .v { font-size: 22px; font-weight: 800; }
  .kpi .l { font-size: 10.5px; font-weight: 700; color: var(--grey); text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }
  .kpi.hi { border-color: #c7b8dd; background: #faf7fd; } .kpi.hi .v { color: var(--plum); }
  .funnel { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .fbox { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; padding: 6px 10px;
          font-size: 12.5px; color: #334155; white-space: nowrap; }
  .fbox b { font-size: 15px; margin-right: 4px; color: var(--ink); }
  .farr { color: var(--faint); display: inline-flex; flex-direction: column; align-items: center; line-height: 1; font-size: 14px; }
  .farr em { font-style: normal; font-size: 10px; font-weight: 800; color: var(--teal); }
  .note { font-size: 11.5px; color: var(--faint); margin: 8px 0 0; }
  h3 { font-size: 13px; margin: 18px 0 8px; }
  .days { display: flex; align-items: flex-end; gap: 9px; margin-top: 6px; }
  .day { text-align: center; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 52px; }
  .bar { width: 13px; border-radius: 2px 2px 0 0; }
  .bar.sent { background: var(--plum); } .bar.recv { background: var(--teal); }
  .dl { font-size: 10px; color: var(--faint); margin-top: 2px; }
  .legend { font-size: 11px; color: var(--grey); align-self: flex-start; margin-left: 10px; }
  .legend i { width: 9px; height: 9px; display: inline-block; border-radius: 2px; margin: 0 3px 0 10px; }
  .prow { display: grid; grid-template-columns: 230px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; align-items: start; }
  .prow:last-of-type { border-bottom: none; }
  .plabel { font-size: 12px; font-weight: 800; color: #475569; }
  .plabel b { color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 5px; background: var(--grey); }
  .plum b { background: var(--plum); } .teal b { background: var(--teal); }
  .amber b { background: var(--amber); } .greyb b { background: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: #f8fafc; border-radius: 999px; padding: 3px 10px;
          font-size: 12px; font-weight: 600; }
  .chip small { color: var(--faint); font-weight: 700; margin-left: 5px; }
  ul.updates { list-style: none; margin: 0; padding: 0; }
  ul.updates li { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f1f5f9;
                  font-size: 13px; line-height: 1.5; color: #334155; }
  ul.updates li:last-child { border-bottom: none; }
  ul.updates .ud { flex: none; width: 44px; font-size: 11px; font-weight: 800; color: var(--faint); padding-top: 2px; }
  #gate { max-width: 460px; margin: 60px auto; background: #fff; border: 1px solid var(--line);
          border-radius: 12px; padding: 24px; }
  #gate input { width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 7px;
                font-size: 13px; margin: 10px 0; }
  #gate button { border: none; background: var(--ink); color: #fff; border-radius: 7px;
                 padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  #err { max-width: 900px; margin: 0 auto 14px; color: var(--red); background: #fdf1f4;
         border: 1px solid #f0cdd5; border-radius: 10px; padding: 12px 14px; font-size: 13px; display: none; }
  @media print {
    body { background: #fff; padding: 0; }
    .top, #gate, #err { display: none !important; }
    .slide { border: none; border-radius: 0; max-width: none; margin: 0; padding: 24px 30px; page-break-after: always; }
    .slide:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="top">
  <h1>Weekly Review</h1>
  <span class="sub" id="stamp">loading…</span>
  <button onclick="localStorage.removeItem('averroes_watch_token');location.reload()" title="Forget the saved token">Reset token</button>
  <button onclick="location.reload()">Reload</button>
  <button onclick="window.print()">Print / save PDF</button>
</div>
<div id="err"></div>
<div id="gate" style="display:none">
  <b>One-time setup</b>
  <p style="font-size:12.5px;color:var(--grey)">Paste the admin token (the same one used for terminal commands).
  It is kept only in this browser, never in the file.</p>
  <input id="tok" type="password" placeholder="avw_...">
  <button onclick="saveTok()">Save and load</button>
</div>
<div id="deck"></div>

<script>
const B = 'https://averroes-deal-backend-890361705054.europe-west1.run.app';

// The Responded page's sections, in its order, in its words.
const SECTIONS = [
  ['nurture',          'Nurture (Ishu)',                   'plum'],
  ['assignment_ready', 'Assignment ready',                 'plum'],
  ['bea_review',       'To discuss for Bea — Thursday',    'teal'],
  ['assoc_review',     'To discuss for calls — Wednesday', 'amber'],
  ['assoc_pending',    'Allocated — call pending',         'amber'],
  ['bea_assigned',     'With Bea',                         'teal'],
  ['progressed',       'Progressed past first meeting',    'teal'],
  ['talk_later',       'Talk later (parked)',              'greyb'],
  ['closed',           'Not interested',                   'greyb'],
];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function saveTok() {
  const t = document.getElementById('tok').value.trim();
  if (t) { localStorage.setItem('averroes_watch_token', t); location.reload(); }
}

async function load() {
  const tok = localStorage.getItem('averroes_watch_token');
  if (!tok) { document.getElementById('gate').style.display = 'block';
              document.getElementById('stamp').textContent = ''; return; }
  let d;
  try {
    const r = await fetch(B + '/weekly-review?token=' + encodeURIComponent(tok));
    if (r.status === 403) throw new Error('Token rejected — press "Reset token" and re-enter it.');
    if (!r.ok) throw new Error('Backend returned ' + r.status + ' — is the latest version deployed?');
    d = await r.json();
  } catch (e) {
    const el = document.getElementById('err');
    el.textContent = e.message || 'Could not reach the backend.';
    el.style.display = 'block';
    document.getElementById('stamp').textContent = '';
    return;
  }

  const a = d.analytics, today = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
  document.getElementById('stamp').textContent = 'live · generated ' + new Date(d.generated_at).toLocaleString('en-GB');
  const alarm = (a.inconsistencies?.contacted_without_email || 0) + (a.inconsistencies?.responded_without_reply || 0);
  const maxDay = Math.max(1, ...a.daily_emails.map(x => Math.max(x.sent, x.received)));

  const funnel = a.funnel.map((f, i) =>
    (i ? `<span class="farr">→${f.conversion_pct != null ? `<em>${f.conversion_pct}%</em>` : ''}</span>` : '') +
    `<span class="fbox"><b>${f.cumulative}</b>${esc(f.stage)}</span>`).join('');

  const days = a.daily_emails.map(x => `
    <div class="day" title="${x.day}: ${x.sent} sent, ${x.received} received">
      <div class="bars">
        <div class="bar sent" style="height:${x.sent / maxDay * 46 + 2}px"></div>
        <div class="bar recv" style="height:${x.received / maxDay * 46 + 2}px"></div>
      </div><div class="dl">${x.day.slice(5)}</div>
    </div>`).join('');

  const pipe = SECTIONS.map(([k, label, tone]) => {
    const rows = d.pipeline[k] || [];
    if (!rows.length) return '';
    const chips = rows.map(c =>
      `<span class="chip">${esc(c.name)}<small>${esc(c.owner || '')}${c.days_since_reply != null ? ' · ' + c.days_since_reply + 'd' : ''}</small></span>`).join('');
    return `<div class="prow"><div class="plabel ${tone}">${label} <b>${rows.length}</b></div><div class="chips">${chips}</div></div>`;
  }).join('');

  const upd = d.updates.map(u =>
    `<li><span class="ud">${u.date.slice(5)}</span>${esc(u.text)}</li>`).join('');

  document.getElementById('deck').innerHTML = `
  <section class="slide">
    <div class="shead"><span class="n">1</span><h2>Outreach &amp; response — cumulative</h2><span class="d">${today}</span></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${a.universe_total ?? '—'}</div><div class="l">Companies in universe</div></div>
      <div class="kpi"><div class="v">${a.emailed_ever ?? '—'}</div><div class="l">Companies emailed</div></div>
      <div class="kpi"><div class="v">${a.replied_ever ?? '—'}</div><div class="l">Companies replied</div></div>
      <div class="kpi hi"><div class="v">${a.response_rate != null ? (a.response_rate * 100).toFixed(1) + '%' : '—'}</div><div class="l">Response rate</div></div>
    </div>
    <div class="funnel">${funnel}</div>
    <p class="note">Cumulative: how many companies have ever reached each stage, with conversion from the previous stage. Autoresponders and bounces never count as replies.</p>
    <h3>Last 7 days</h3>
    <div class="kpis">
      <div class="kpi"><div class="v">${d.last7.sent}</div><div class="l">Outreach emails sent</div></div>
      <div class="kpi"><div class="v">${d.last7.genuine_replies}</div><div class="l">Genuine replies received</div></div>
      <div class="kpi"><div class="v" style="color:${alarm ? 'var(--red)' : 'var(--teal)'}">${alarm || '✓'}</div><div class="l">${alarm ? 'Data inconsistencies' : 'Data integrity clean'}</div></div>
    </div>
    <div class="days">${days}<div class="legend"><i class="bar sent"></i>sent<i class="bar recv"></i>received</div></div>
  </section>
  <section class="slide">
    <div class="shead"><span class="n">2</span><h2>Pipeline development — everyone who replied, by section</h2><span class="d">${today}</span></div>
    ${pipe || '<p class="note">No replied companies yet.</p>'}
    <p class="note">Same sections and rules as the Responded page. Open founder conversations: ${Object.entries(d.open_calls).map(([o, n]) => `${esc(o)} ${n}`).join(' · ')}.</p>
  </section>
  <section class="slide">
    <div class="shead"><span class="n">3</span><h2>Tool updates this week</h2><span class="d">${today}</span></div>
    <ul class="updates">${upd}</ul>
  </section>`;
}
load();
</script>
</body>
</html>
